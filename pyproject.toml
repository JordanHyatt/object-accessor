[project]
name = "object-accessor"
version = "0.0.6"
description = "A Python library for navigating nested data structures using simple accessor paths. Provides clean, intuitive way to access nested attributes, dictionary keys, and list indices through a unified interface."
readme = "README.md"
authors = [
    { name = "Jordan Hyatt", email = "jordan.t.hyatt@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Development Status :: 5 - Production/Stable",
]
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "twine>=7.0.0",
]
